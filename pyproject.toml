[project]
name = "assignment4-mcp"
version = "0.1.0"
description = "A local MCP server for secure sales data analysis with Claude Desktop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"